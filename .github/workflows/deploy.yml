name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Entrar a la carpeta del proyecto
            cd ~/next-prueba-desempe-o
            
            # 2. Traer los últimos cambios desde GitHub
            git fetch --all
            git reset --hard origin/master
            
            # 3. Instalar dependencias nuevas
            npm install
            
            # 4. Actualizar Prisma (por si cambió el esquema)
            npx prisma generate
            
            # 5. Compilar la app para producción
            npm run build
            
            # 6. Reiniciar la app con PM2
            pm2 restart nextjs-app